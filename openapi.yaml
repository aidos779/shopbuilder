  /products/generate-variants:
    post:
      tags:
        - Products
      summary: Preview SKU matrix (cartesian product, not persisted)
      description: |
        Generates all attribute combinations. Example: sizes=["S","M"], colors=["Black","White"] → 4 SKUs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sizes:
                  type: array
                  items:
                    type: string
                  example:
                    - S
                    - M
                    - L
                colors:
                  type: array
                  items:
                    type: string
                  example:
                    - Black
                    - White
                    - Navy
                materials:
                  type: array
                  items:
                    type: string
                  example:
                    - Cotton
                    - Polyester
      responses:
        '200':
          description: Generated SKU combinations
          content:
            application/json:
              example:
                count: 18
                variants:
                  - sku: S-Black-Cotton
                    size: S
                    color: Black
                    material: Cotton
        '400':
          description: No attributes provided
  /products/save-variants:
